services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: financas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financas}
      POSTGRES_DB: financas
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - dados_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financas -d financas"]
      interval: 5s
      retries: 10

  api:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://financas:${POSTGRES_PASSWORD:-financas}@db:5432/financas?schema=public"
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-de-exemplo}
      PORT: "3000"
      ADMIN_NOME: ${ADMIN_NOME:-Demo}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-demo@financas.local}
      ADMIN_SENHA: ${ADMIN_SENHA:-demo1234}
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
      # Endereço para abrir no celular (botão do QR code). No Windows o nome do computador vem sozinho.
      ENDERECO_REDE: ${ENDERECO_REDE:-}
      NOME_DA_MAQUINA: ${COMPUTERNAME:-${HOSTNAME:-}}
      WEB_PORT: ${WEB_PORT:-8092}
      # Drive: pasta sincronizada que guarda os dados (escolhida pelo conectar-drive.ps1). Vazio = desligado.
      PASTA_DRIVE: ${PASTA_DRIVE:-}
      # Saída de emergência: "true" ignora a verificação em duas etapas no login (para quem perdeu o aparelho).
      DESATIVAR_2FA: ${DESATIVAR_2FA:-false}
      # Endereço HTTPS do sistema (ex.: https://meu-pc.tailnet.ts.net), para o QR code e para instalar como aplicativo.
      URL_PUBLICA: ${URL_PUBLICA:-}
      # Leitura de cupom por foto: chave da API da Anthropic (também dá para informar na tela).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
      PLUGGY_SANDBOX: ${PLUGGY_SANDBOX:-false}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ${PASTA_DRIVE:-./drive}:/drive
      # Conversa com o atualizar.ps1 (versão instalada, pedido e situação da atualização).
      - ./atualizacao:/atualizacao
      # Cópias do banco feitas antes de cada atualização (a tela lista; quem restaura é o atualizar.ps1).
      - ./backups:/backups:ro
    ports:
      - "127.0.0.1:${API_PORT:-3092}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    build: ./client
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8092}:80"
    restart: unless-stopped

volumes:
  dados_db:
